name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Format
        run: dotnet format --verify-no-changes

      # nuget-license both checks that every package this ships is under a licence the project
      # accepts, and writes the notices the application shows. The generated report is committed
      # because a source generator compiles it into the binary, so a stale one is a build that
      # credits the wrong packages. What is ignored is what builds the binary rather than travelling
      # in it: the diagnostics support package ships in Debug alone, and the compiler and the trimmer
      # carry the host's runtime identifier in their package id, so a report naming them would differ
      # between this runner and a developer machine.
      - name: Licenses
        run: |
          dotnet tool restore
          dotnet nuget-license $LICENSE_ARGS -o JsonPretty -fo src/Cgf.CameraControl.App/Licenses/third-party-licenses.json
          dotnet nuget-license $LICENSE_ARGS -o Markdown -fo third-party-licenses.md
          git diff --exit-code -- src/Cgf.CameraControl.App/Licenses/third-party-licenses.json
        env:
          LICENSE_ARGS: >-
            -i src/Cgf.CameraControl.App/Cgf.CameraControl.App.csproj
            -t
            -ignore "AvaloniaUI.DiagnosticsSupport;Microsoft.DotNet.ILCompiler;runtime.*.Microsoft.DotNet.ILCompiler;Microsoft.NET.ILLink.Tasks"
            -a MIT;Zlib;BSD-3-Clause

      - name: Publish the licence report
        uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: third-party-licenses.md

      # The test projects are Microsoft.Testing.Platform executables, so they are run directly
      # rather than through dotnet test.
      - name: Test
        run: |
          failed=0
          for suite in tests/*/bin/Release/net10.0/*.Tests; do
            echo "::group::$(basename "$suite")"
            "$suite" || failed=1
            echo "::endgroup::"
          done
          exit $failed
