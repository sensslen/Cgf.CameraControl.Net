name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Format
        run: dotnet format --verify-no-changes

      # The same script a developer runs, so which packages are ignored and which licences are
      # accepted are written down once. The report and the licence texts are committed because a
      # source generator compiles them into the binary, so a stale one is a build that credits the
      # wrong packages.
      - name: Licenses
        run: |
          dotnet tool restore
          python3 packaging/licenses/fetch-texts.py --markdown third-party-licenses.md
          git diff --exit-code -- src/Cgf.CameraControl.App/Licenses

      - name: Publish the licence report
        uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: third-party-licenses.md

      # The test projects are Microsoft.Testing.Platform executables, so they are run directly
      # rather than through dotnet test.
      - name: Test
        run: |
          failed=0
          for suite in tests/*/bin/Release/net10.0/*.Tests; do
            echo "::group::$(basename "$suite")"
            "$suite" || failed=1
            echo "::endgroup::"
          done
          exit $failed
