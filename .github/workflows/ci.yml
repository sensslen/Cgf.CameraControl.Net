name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Before the build, because a source generator compiles the report into the binary. It names
      # the exact versions restored, so generating it here is what keeps the notices from crediting
      # what an earlier commit happened to resolve, and nuget-license refuses a licence the project
      # has not accepted. The same script a developer runs, so the ignored packages and the accepted
      # licences are written down once.
      #
      # No runtime identifier, unlike the release builds: the whole package graph is what has to be
      # under an accepted licence, including the natives of the platforms this run is not building.
      - name: Licence report
        run: |
          dotnet tool restore
          python3 packaging/licenses/fetch-texts.py --report-only --markdown third-party-licenses.md

      - name: Build
        run: dotnet build -c Release

      - name: Format
        run: dotnet format --verify-no-changes

      - name: Publish the licence report
        uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: third-party-licenses.md

      # The test projects are Microsoft.Testing.Platform executables, so they are run directly
      # rather than through dotnet test.
      - name: Test
        run: |
          failed=0
          for suite in tests/*/bin/Release/net10.0/*.Tests; do
            echo "::group::$(basename "$suite")"
            "$suite" || failed=1
            echo "::endgroup::"
          done
          exit $failed
