name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      # The images disagree on whether python is called python or python3.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'

      # Before the build, because a source generator compiles the report into the binary. It names
      # the exact versions restored, so generating it here is what keeps the notices from crediting
      # what an earlier commit happened to resolve, and nuget-license refuses a licence the project
      # has not accepted. The same script a developer runs, so the ignored packages and the accepted
      # licences are written down once.
      #
      # No runtime identifier, unlike the release builds: the whole package graph is what has to be
      # under an accepted licence, including the natives of the platforms this run is not building.
      - name: Licence report
        run: |
          dotnet tool restore
          python packaging/licenses/fetch-texts.py --report-only --markdown third-party-licenses.md

      - name: Build
        run: dotnet build -c Release

      - name: Verify icon assets and assignments
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s packaging/icon -p "test_*.py"
          python3 packaging/icon/verify.py

      - name: Format
        if: runner.os == 'Linux'
        run: dotnet format --verify-no-changes

      - name: Publish the licence report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: third-party-licenses
          path: third-party-licenses.md

      # The test projects are Microsoft.Testing.Platform executables, so they are run directly
      # rather than through dotnet test.
      - name: Test
        shell: bash
        run: |
          failed=0
          for suite in tests/*/bin/Release/net10.0/*.Tests tests/*/bin/Release/net10.0/*.Tests.exe; do
            [ -f "$suite" ] || continue
            echo "::group::$(basename "$suite")"
            "$suite" || failed=1
            echo "::endgroup::"
          done
          exit $failed

  # Trimming drops what reflection reaches for without a word, so a build that passes every test
  # can still publish a binary that fails at start. The release builds every platform; one is
  # enough to catch that before a tag.
  aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Licence report
        run: |
          dotnet tool restore
          python3 packaging/licenses/fetch-texts.py --report-only --runtime linux-x64

      - name: Publish
        run: dotnet publish src/Cgf.CameraControl.App/Cgf.CameraControl.App.csproj -c Release -r linux-x64 -o publish

      - name: Verify the trimmed build
        run: publish/CgfCameraControl --aot-probe
