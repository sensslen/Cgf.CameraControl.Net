name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Format
        run: dotnet format --verify-no-changes

      # The test projects are Microsoft.Testing.Platform executables, so they are run directly
      # rather than through dotnet test.
      - name: Test
        run: |
          failed=0
          for suite in tests/*/bin/Release/net10.0/*.Tests; do
            echo "::group::$(basename "$suite")"
            "$suite" || failed=1
            echo "::endgroup::"
          done
          exit $failed
