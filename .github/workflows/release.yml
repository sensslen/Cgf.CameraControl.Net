name: release

on:
  push:
    tags:
      - "v*"

# NativeAOT cannot cross compile between operating systems, so each one builds on its own runner.
# macOS builds both of its architectures because it is the only host that can.
#
# Signing is conditional on the credentials existing, so a fork without them still produces working
# artifacts. Unsigned means a SmartScreen warning on Windows, but on macOS it means Gatekeeper
# refuses the application outright, which the release notes have to say.
#
# What each platform needs, and why the two are configured so differently, is in
# docs/CODE_SIGNING.md.

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.version.outputs.full_without_prefix }}
      file: ${{ steps.version.outputs.major_without_prefix }}.${{ steps.version.outputs.minor }}.${{ steps.version.outputs.patch }}.0
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: nowsprinting/check-version-format-action@2946b47fb3590f88fc80b3579e72cd15c0fa90cb # v5.0.4
        id: version
        with:
          prefix: 'v'

      # The action reports a malformed tag rather than failing on it, and every version below would
      # then be an empty string.
      - name: Reject a malformed tag
        if: steps.version.outputs.is_valid != 'true'
        run: |
          echo "::error::${{ github.ref_name }} is not a valid version tag"
          exit 1

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runs-on: windows-latest
            native: true
          - rid: win-arm64
            runs-on: windows-11-arm
            native: true
          - rid: osx-x64
            runs-on: macos-latest
            native: false
          - rid: osx-arm64
            runs-on: macos-latest
            native: true
          - rid: linux-x64
            runs-on: ubuntu-latest
            native: true
          - rid: linux-arm64
            runs-on: ubuntu-24.04-arm
            native: true
    runs-on: ${{ matrix.runs-on }}
    # Lifted to the job so the signing steps can test for it: an if condition cannot read secrets
    # directly, only through env. Windows needs no such lift, its configuration is not secret.
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/Cgf.CameraControl.App/Cgf.CameraControl.App.csproj
          -c Release -r ${{ matrix.rid }} -o publish
          -p:Version=${{ needs.version.outputs.full }}
          -p:ContinuousIntegrationBuild=true

      # AtemSharp builds its command registry by reflecting over its own assembly, and localization is
      # embedded rather than carried in satellite assemblies. Both fail silently under trimming, so
      # the published binary has to say out loud that it still works. Skipped only where the runner
      # cannot execute what it just built; every operating system still probes one architecture.
      - name: Verify the trimmed build
        if: matrix.native
        shell: bash
        run: |
          binary=publish/CgfCameraControl
          [ -f "$binary.exe" ] && binary="$binary.exe"
          "$binary" --aot-probe

      - name: Note the skipped verification
        if: ${{ !matrix.native }}
        run: echo "::warning::aot-probe skipped for ${{ matrix.rid }}, this runner cannot execute it"

      - name: Package (Windows)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            choco install nsis -y --no-progress
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $arch = '${{ matrix.rid }}' -replace '^win-', ''
          $source = [System.IO.Path]::GetFullPath('publish')
          $out = [System.IO.Path]::GetFullPath('artifacts/CameraControl-${{ needs.version.outputs.full }}-${{ matrix.rid }}-setup.exe')
          # Each switch is passed as its own quoted string. Bare words containing quotes are parsed
          # in argument mode, where the inner quotes end the token early.
          $switches = @(
            "/DVERSION=${{ needs.version.outputs.full }}"
            "/DFILEVERSION=${{ needs.version.outputs.file }}"
            "/DARCH=$arch"
            "/DSOURCE=$source"
            "/DOUTFILE=$out"
          )
          & $nsis @switches packaging/windows/installer.nsi
          if (-not (Test-Path $out)) { throw "makensis produced no installer" }

      # Signing happens off the runner. Since June 2023 a publicly trusted code signing key has to
      # live on certified hardware, so there is no .pfx to hand a build agent any more: the installer
      # is uploaded, signed by the service that holds the key, and downloaded back over the top.
      - name: Upload the installer for signing
        id: signing-input
        if: ${{ startsWith(matrix.rid, 'win-') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: signing-input-${{ matrix.rid }}
          path: artifacts/*.exe
          if-no-files-found: error

      - name: Sign (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signing-input.outputs.artifact-id }}
          wait-for-completion: true
          # Lands on top of the unsigned installer, so what gets released is the signed one.
          output-artifact-directory: artifacts

      - name: Note the unsigned installer
        if: ${{ startsWith(matrix.rid, 'win-') && vars.SIGNPATH_ORGANIZATION_ID == '' }}
        run: echo "::warning::${{ matrix.rid }} went out unsigned, SignPath is not configured"

      - name: Package (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: |
          brew install create-dmg
          mkdir -p artifacts staging
          packaging/macos/make-bundle.sh publish "${{ needs.version.outputs.full }}" "staging/Camera Control.app"

      - name: Sign and notarize the application (macOS)
        if: ${{ startsWith(matrix.rid, 'osx-') && env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          echo "$CERTIFICATE" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm cert.p12

          app="staging/Camera Control.app"

          # Deepest first: a bundle is only valid if everything inside it was signed before the
          # bundle itself. Not with --deep, which Apple documents as unfit for shipping builds
          # because it signs only what it recognizes and hands everything the same flags. The
          # native libraries the application loads at run time are what it would miss.
          find "$app/Contents" -type f \( -name '*.dylib' -o -name '*.so' \) -print0 |
            while IFS= read -r -d '' nested; do
              codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$nested"
            done

          # The hardened runtime is what notarization requires.
          codesign --force --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" "$app/Contents/MacOS/CgfCameraControl"
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$app"
          codesign --verify --strict --deep --verbose=2 "$app"

          # Stapled here as well as onto the disk image, so the application keeps validating once it
          # has been dragged to Applications on a machine that is offline.
          ditto -c -k --keepParent "$app" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$app"

      - name: Build the disk image (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: |
          dmg="artifacts/CameraControl-${{ needs.version.outputs.full }}-${{ matrix.rid }}.dmg"
          # create-dmg reports failure when it cannot set a volume icon, which is not fatal, so the
          # result is judged by whether the image exists.
          create-dmg \
            --volname "Camera Control" \
            --app-drop-link 480 170 \
            --icon "Camera Control.app" 160 170 \
            --window-size 640 360 \
            "$dmg" "staging/Camera Control.app" || true
          test -f "$dmg"

      # The disk image is what carries the mark of the web, so it needs its own ticket. Signing the
      # application alone leaves Gatekeeper objecting to the thing the user actually double clicks.
      - name: Sign and notarize the disk image (macOS)
        if: ${{ startsWith(matrix.rid, 'osx-') && env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg="artifacts/CameraControl-${{ needs.version.outputs.full }}-${{ matrix.rid }}.dmg"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"

      - name: Note the unnotarized disk image
        if: ${{ startsWith(matrix.rid, 'osx-') && env.APPLE_CERTIFICATE_BASE64 == '' }}
        run: echo "::warning::${{ matrix.rid }} went out unnotarized, Gatekeeper will refuse it"

      - name: Package (Linux)
        if: startsWith(matrix.rid, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

          mkdir -p artifacts packaging/linux/payload
          cp publish/CgfCameraControl packaging/linux/payload/
          cp publish/*.so packaging/linux/payload/ 2>/dev/null || true
          cp packaging/linux/*.desktop packaging/linux/*.metainfo.xml packaging/linux/payload/
          cp packaging/icon/icon-256.png packaging/icon/icon.svg packaging/linux/payload/

          flatpak-builder --repo=repo --force-clean build \
            packaging/linux/io.github.sensslen.CgfCameraControl.yml
          flatpak build-bundle repo \
            "artifacts/CameraControl-${{ needs.version.outputs.full }}-${{ matrix.rid }}.flatpak" \
            io.github.sensslen.CgfCameraControl

      # Prefixed because the release job takes everything named dist-*, and the unsigned installer
      # uploaded for signing carries the same file name as the signed one that replaces it.
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          prerelease: ${{ needs.version.outputs.prerelease != '' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*

  # winget is how Windows gets the application and how it learns a new version exists, which is why
  # the application itself has no update mechanism. winget understands NSIS natively as the
  # "nullsoft" installer type, including its silent switches.
  #
  # wingetcreate updates an existing package, so the first version has to be submitted once by hand
  # with `wingetcreate new`. Prereleases are not submitted.
  winget:
    needs: [version, release]
    if: ${{ needs.version.outputs.prerelease == '' }}
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to winget
        if: ${{ env.WINGET_TOKEN != '' }}
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.full }}"
          $base = "https://github.com/${{ github.repository }}/releases/download/v$version"
          winget install --id Microsoft.WingetCreate --exact --source winget `
            --accept-package-agreements --accept-source-agreements
          wingetcreate update Sensslen.CameraControl --version $version --submit --token $env:WINGET_TOKEN `
            --urls "$base/CameraControl-$version-win-x64-setup.exe|x64" `
                   "$base/CameraControl-$version-win-arm64-setup.exe|arm64"

      - name: Note the skipped submission
        if: ${{ env.WINGET_TOKEN == '' }}
        run: echo "::warning::winget submission skipped, WINGET_TOKEN is not configured"
