name: release

on:
  push:
    tags:
      - "v*"

# NativeAOT cannot cross compile between operating systems, so each one builds on its own runner.
# macOS builds both of its architectures because it is the only host that can.
#
# Signing is conditional on the credentials existing, so a fork without them still produces working
# artifacts. Unsigned means a SmartScreen warning on Windows, but on macOS it means Gatekeeper
# refuses the application outright, which the release notes have to say.

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.version.outputs.full_without_prefix }}
      file: ${{ steps.version.outputs.major_without_prefix }}.${{ steps.version.outputs.minor }}.${{ steps.version.outputs.patch }}.0
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: nowsprinting/check-version-format-action@62b39fce3eab26b761544e58016e2183d7a73c0b # v5.0.8
        id: version
        with:
          prefix: 'v'

      # The action reports a malformed tag rather than failing on it, and every version below would
      # then be an empty string.
      - name: Reject a malformed tag
        if: steps.version.outputs.is_valid != 'true'
        run: |
          echo "::error::${{ github.ref_name }} is not a valid version tag"
          exit 1

  build:
    needs: [version, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runs-on: windows-latest
            native: true
          - rid: win-arm64
            runs-on: windows-11-arm
            native: true
          - rid: osx-x64
            runs-on: macos-latest
            native: false
          - rid: osx-arm64
            runs-on: macos-latest
            native: true
          - rid: linux-x64
            runs-on: ubuntu-latest
            native: true
          - rid: linux-arm64
            runs-on: ubuntu-24.04-arm
            native: true
    runs-on: ${{ matrix.runs-on }}
    # An if condition cannot read secrets directly, only through env. Only whether they exist is
    # lifted to the job, so the certificates themselves reach no step but the one that signs.
    env:
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      # The images disagree on whether python is called python or python3.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'

      # The licence report is generated rather than committed, and a source generator compiles it
      # into the binary, so it has to exist before the publish below. Generated on the runner that
      # publishes, under the runtime identifier it publishes for: a report is then the packages that
      # binary resolved something from, rather than every package every platform between them needs.
      - name: Licence report
        run: |
          dotnet tool restore
          python packaging/licenses/fetch-texts.py --report-only --runtime ${{ matrix.rid }}

      - name: Publish
        run: >
          dotnet publish src/Cgf.CameraControl.App/Cgf.CameraControl.App.csproj
          -c Release -r ${{ matrix.rid }} -o publish
          -p:Version=${{ needs.version.outputs.full }}
          -p:ContinuousIntegrationBuild=true

      # AtemSharp builds its command registry by reflecting over its own assembly, and localization is
      # embedded rather than carried in satellite assemblies. Both fail silently under trimming, so
      # the published binary has to say out loud that it still works. Skipped only where the runner
      # cannot execute what it just built; every operating system still probes one architecture.
      - name: Verify the trimmed build
        if: matrix.native
        shell: bash
        run: |
          binary=publish/CgfCameraControl
          [ -f "$binary.exe" ] && binary="$binary.exe"
          "$binary" --aot-probe

      - name: Note the skipped verification
        if: ${{ !matrix.native }}
        run: echo "::warning::aot-probe skipped for ${{ matrix.rid }}, this runner cannot execute it"

      # Embedded in the installer, which runs it when SDL3's runtime is missing.
      - name: Fetch the Visual C++ redistributable (Windows)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $arch = '${{ matrix.rid }}' -replace '^win-', ''
          Invoke-WebRequest "https://aka.ms/vs/17/release/vc_redist.$arch.exe" -OutFile vc_redist.exe

      # Before packaging, because the installer carries its own copy of the executable.
      - name: Sign the application (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') && env.HAS_WINDOWS_CERTIFICATE == 'true' }}
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: packaging/windows/sign.ps1 publish/CgfCameraControl.exe

      - name: Package (Windows)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            choco install nsis -y --no-progress
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $arch = '${{ matrix.rid }}' -replace '^win-', ''
          $source = [System.IO.Path]::GetFullPath('publish')
          $out = [System.IO.Path]::GetFullPath('artifacts/CameraControl-${{ needs.version.outputs.full }}-${{ matrix.rid }}-setup.exe')
          # Each switch is passed as its own quoted string. Bare words containing quotes are parsed
          # in argument mode, where the inner quotes end the token early.
          $switches = @(
            "/DVERSION=${{ needs.version.outputs.full }}"
            "/DFILEVERSION=${{ needs.version.outputs.file }}"
            "/DARCH=$arch"
            "/DSOURCE=$source"
            "/DVCREDIST=$([System.IO.Path]::GetFullPath('vc_redist.exe'))"
            "/DOUTFILE=$out"
          )
          & $nsis @switches packaging/windows/installer.nsi
          if (-not (Test-Path $out)) { throw "makensis produced no installer" }

      - name: Verify executable and installer icons (Windows)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: >
          python packaging/icon/verify.py
          --windows-exe publish/CgfCameraControl.exe
          --windows-exe artifacts/CameraControl-${{ needs.version.outputs.full }}-${{ matrix.rid }}-setup.exe

      - name: Sign the installer (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') && env.HAS_WINDOWS_CERTIFICATE == 'true' }}
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: packaging/windows/sign.ps1 (Get-ChildItem artifacts/*.exe).FullName

      - name: Package (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: |
          brew install create-dmg
          mkdir -p artifacts staging
          packaging/macos/make-bundle.sh publish "${{ needs.version.outputs.full }}" "staging/Camera Control.app"

      - name: Sign and notarize (macOS)
        if: ${{ startsWith(matrix.rid, 'osx-') && env.HAS_APPLE_CERTIFICATE == 'true' }}
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          echo "$CERTIFICATE" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm cert.p12

          # Deepest first: a bundle is only valid if everything inside it was signed before the
          # bundle itself. The hardened runtime is what notarization requires.
          codesign --force --deep --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" "staging/Camera Control.app"
          codesign --verify --strict --verbose=2 "staging/Camera Control.app"

          ditto -c -k --keepParent "staging/Camera Control.app" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "staging/Camera Control.app"

      - name: Build the disk image (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: |
          dmg="artifacts/CameraControl-${{ needs.version.outputs.full }}-${{ matrix.rid }}.dmg"
          # create-dmg reports failure when it cannot set a volume icon, which is not fatal, so the
          # result is judged by whether the image exists.
          create-dmg \
            --volname "Camera Control" \
            --app-drop-link 480 170 \
            --icon "Camera Control.app" 160 170 \
            --window-size 640 360 \
            "$dmg" "staging/Camera Control.app" || true
          test -f "$dmg"

      - name: Package (Linux)
        if: startsWith(matrix.rid, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

          mkdir -p artifacts packaging/linux/payload
          cp publish/CgfCameraControl packaging/linux/payload/
          cp publish/*.so packaging/linux/payload/
          cp packaging/linux/*.desktop packaging/linux/*.metainfo.xml packaging/linux/payload/
          cp packaging/icon/icon-256.png packaging/icon/icon.svg packaging/linux/payload/

          flatpak-builder --repo=repo --force-clean build \
            packaging/linux/io.github.sensslen.CgfCameraControl.yml
          flatpak build-bundle repo \
            "artifacts/CameraControl-${{ needs.version.outputs.full }}-${{ matrix.rid }}.flatpak" \
            io.github.sensslen.CgfCameraControl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true

      # Whoever downloads an unnotarized build meets a dialog that does not say what to do about it,
      # so the release itself says it. The generated notes are appended below this.
      - name: Note the missing notarization
        if: ${{ env.HAS_APPLE_CERTIFICATE != 'true' }}
        run: |
          cat >> "$GITHUB_ENV" <<'NOTE'
          RELEASE_BODY<<BODY
          ### macOS

          These builds are signed ad-hoc rather than with a Developer ID, so macOS asks before
          opening them. Move the app to Applications, then open **System Settings → Privacy &
          Security** and choose **Open Anyway**, or clear the download flag once:

          ```bash
          xattr -dr com.apple.quarantine "/Applications/Camera Control.app"
          ```
          BODY
          NOTE

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          prerelease: ${{ needs.version.outputs.prerelease != '' }}
          body: ${{ env.RELEASE_BODY }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*

  # winget is how Windows gets the application and how it learns a new version exists, which is why
  # the application itself has no update mechanism. winget understands NSIS natively as the
  # "nullsoft" installer type, including its silent switches.
  #
  # wingetcreate updates an existing package, so the first version has to be submitted once by hand
  # with `wingetcreate new`. Prereleases are not submitted.
  winget:
    needs: [version, release]
    if: ${{ needs.version.outputs.prerelease == '' }}
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      # wingetcreate submits from the token owner's fork of winget-pkgs and gives up when that fork
      # has fallen too far behind upstream to sync, which a fork touched once per release always
      # does. A fork that does not exist yet is left for wingetcreate to create.
      - name: Sync the winget-pkgs fork
        if: ${{ env.WINGET_TOKEN != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ env.WINGET_TOKEN }}
        run: |
          $owner = gh api user --jq .login
          gh api "repos/$owner/winget-pkgs" --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            echo "no winget-pkgs fork under $owner yet"
            exit 0
          }
          gh api -X POST "repos/$owner/winget-pkgs/merge-upstream" -f branch=master --jq .message

      - name: Submit to winget
        if: ${{ env.WINGET_TOKEN != '' }}
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.full }}"
          $base = "https://github.com/${{ github.repository }}/releases/download/v$version"
          winget install --id Microsoft.WingetCreate --exact --source winget `
            --accept-package-agreements --accept-source-agreements
          wingetcreate update Sensslen.CameraControl --version $version --submit --token $env:WINGET_TOKEN `
            --urls "$base/CameraControl-$version-win-x64-setup.exe|x64" `
                   "$base/CameraControl-$version-win-arm64-setup.exe|arm64"

      - name: Note the skipped submission
        if: ${{ env.WINGET_TOKEN == '' }}
        run: echo "::warning::winget submission skipped, WINGET_TOKEN is not configured"
